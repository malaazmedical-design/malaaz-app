name: EAS Build Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile (preview = test APK, production = Google Play AAB)"
        required: false
        default: "preview"
      ref:
        description: "Git ref to build from"
        required: false
        default: "main"

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Android
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: eas build -p android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
