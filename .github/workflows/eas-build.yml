name: EAS Build Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: false
        default: "preview"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bold-darwin-ddq2ri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: eas build -p android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
