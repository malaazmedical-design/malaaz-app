name: EAS Diagnose

on:
  push:
    branches: [claude/bold-darwin-ddq2ri]

jobs:
  diagnose:
    name: Diagnose channels and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: View preview channel
        run: eas channel:view preview --non-interactive

      - name: Recent android builds
        run: eas build:list --platform android --limit 5 --non-interactive
