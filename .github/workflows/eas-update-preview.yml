name: EAS Update — Preview (يدوي)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'اسم الـ branch'
        required: true
        default: 'main'
      message:
        description: 'رسالة التحديث'
        required: false
        default: 'Preview update'

jobs:
  update:
    name: OTA Preview Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push OTA update to mizo-test channel
        run: eas update --channel mizo-test --message "${{ github.event.inputs.message }}" --non-interactive

      - name: Done
        run: echo "✅ Update pushed to mizo-test channel — للتجربة افتح expo.dev وغيّر الـ channel لـ mizo-test"
