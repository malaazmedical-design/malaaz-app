name: EAS Update — Revoice (OTA)

on:
  push:
    branches: [revoice]

jobs:
  update:
    name: OTA Update (mizo-test channel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push OTA update to mizo-test channel
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          # same app variant as the mizo-test build, so the update manifest carries the
          # malaaz-revoice:// deep-link scheme (used by the Google sign-in redirect)
          APP_VARIANT: mizotest
          # Test project only (public anon key). Inlined into the JS bundle at publish time.
          EXPO_PUBLIC_SUPABASE_URL: https://dmyxxreescjwdpkdeqan.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteXh4cmVlc2Nqd2Rwa2RlcWFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMDMyNjUsImV4cCI6MjEwNjY3OTI2NX0.h9tJO-Qlt7oTx6K2YhQ6WBxNFlhnQxZr8OK9DvyafOo
          EXPO_PUBLIC_VODAFONE_CASH: "01039091989"
        run: eas update --channel mizo-test --message "$(echo "$COMMIT_MSG" | head -1)" --non-interactive
