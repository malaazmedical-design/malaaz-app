name: EAS Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Update channel (preview or production)"
        required: false
        default: "preview"
      message:
        description: "Update message"
        required: false
        default: "OTA update"

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: eas update --channel ${{ github.event.inputs.channel || 'preview' }} --message "${{ github.event.inputs.message || 'OTA update' }}" --non-interactive
