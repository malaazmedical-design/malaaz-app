name: EAS Update (OTA)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "EAS update branch (preview or production)"
        required: false
        default: "preview"
      message:
        description: "Update message"
        required: false
        default: "تحديث"

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bold-darwin-ddq2ri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: eas update --branch "${{ github.event.inputs.branch || 'preview' }}" --message "${{ github.event.inputs.message || 'تحديث' }}" --non-interactive
