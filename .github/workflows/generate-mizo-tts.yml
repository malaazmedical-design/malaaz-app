name: توليد أصوات ميزو (ElevenLabs → Supabase)

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate & Upload TTS
    runs-on: ubuntu-latest
    steps:
      - name: Batch 1 (0-29)
        run: |
          curl -s -X POST \
            "https://omsictbrqlsohrmxeuym.supabase.co/functions/v1/generate-mizo-tts" \
            -H "Content-Type: application/json" \
            -H "x-secret: malaaz-tts-2026" \
            -d '{"voice_id":"${{ secrets.ELEVEN_VOICE_ID }}","api_key":"${{ secrets.ELEVEN_API_KEY }}","batch_start":0,"batch_size":30}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'✓ done={d[\"done\"]} skipped={d[\"skipped\"]} failed={d[\"failed\"]}')"

      - name: Batch 2 (30-59)
        run: |
          curl -s -X POST \
            "https://omsictbrqlsohrmxeuym.supabase.co/functions/v1/generate-mizo-tts" \
            -H "Content-Type: application/json" \
