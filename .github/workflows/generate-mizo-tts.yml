            -d '{"voice_id":"${{ secrets.ELEVEN_VOICE_ID }}","api_key":"${{ secrets.ELEVEN_API_KEY }}","batch_start":60,"batch_size":30}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'✓ done={d[\"done\"]} skipped={d[\"skipped\"]} failed={d[\"failed\"]}')"

      - name: Batch 4 (90-119)
        run: |
          curl -s -X POST \
